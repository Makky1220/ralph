version: 2

project_name: ralph

before:
  hooks:
    - go mod tidy

builds:
  - id: ralph
    main: ./cmd/ralph
    dir: .
    binary: ralph
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.GitCommit={{.Commit}}
      - -X main.BuildDate={{.Date}}

archives:
  - id: ralph
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch
  groups:
    - title: "新機能"
      regexp: "^feat"
      order: 0
    - title: "バグ修正"
      regexp: "^fix"
      order: 1
    - title: "パフォーマンス"
      regexp: "^perf"
      order: 2
    - title: "その他"
      order: 999

brews:
  - name: ralph
    repository:
      owner: thomas0124
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/thomas0124/ralph"
    description: "Harness engineering & multi-agent org runtime CLI for Claude Code / Codex projects"
    license: "MIT"
    install: |
      bin.install "ralph"
    test: |
      system "#{bin}/ralph", "--version"

release:
  github:
    owner: thomas0124
    name: ralph
  draft: false
  prerelease: auto
